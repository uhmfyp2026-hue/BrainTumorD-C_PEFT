<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Classify Scan — NeuroScan AI</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05090f;--bg2:#0d1523;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --accent:#2a72d8;--accent2:#1d5db8;--glow:rgba(42,114,216,0.22);
  --text:#e8edf5;--muted:#7a8fa8;--dim:#3a4d63;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--purple:#8b5cf6;
  --r8:8px;--r12:12px;--r16:16px;--r20:20px;
}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.7;min-height:100vh}
a{text-decoration:none;color:inherit}

/* NAV */
.nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 2rem;background:rgba(5,9,15,0.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--text)}
.logo strong{color:var(--accent)}
.logo-icon{width:34px;height:34px;min-width:34px;background:linear-gradient(135deg,#1a3a6e,#2a72d8);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:16px;height:16px;display:block;fill:none;stroke:#fff;stroke-width:2}
.nav-back{font-size:14px;color:var(--muted);padding:7px 13px;border-radius:var(--r8);border:1px solid var(--border2);transition:all .2s}
.nav-back:hover{color:var(--text);background:rgba(255,255,255,.05)}

/* ENSEMBLE BADGE */
.ensemble-badge{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--accent);
  background:rgba(42,114,216,0.1);border:1px solid rgba(42,114,216,0.25);
  padding:5px 13px;border-radius:20px;
}
.ensemble-badge .dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s ease-in-out infinite}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:3rem 2rem 5rem}
.main h1{font-size:28px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:2rem}

/* UPLOAD ZONE */
.upload-zone{border:2px dashed rgba(42,114,216,.3);border-radius:var(--r20);padding:3rem 2rem;text-align:center;cursor:pointer;transition:all .2s;background:rgba(42,114,216,.04)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(42,114,216,.08)}
.up-icon{width:52px;height:52px;background:rgba(42,114,216,.15);border-radius:var(--r12);display:flex;align-items:center;justify-content:center;margin:0 auto 1.1rem;color:var(--accent)}
.up-icon svg{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:1.8}
.upload-zone h3{font-size:16px;font-weight:700;margin-bottom:6px}
.upload-zone p{font-size:13px;color:var(--muted);margin-bottom:1.2rem}
.btn-browse{font-size:13px;font-weight:600;color:var(--accent);background:rgba(42,114,216,.12);border:1px solid rgba(42,114,216,.3);padding:8px 20px;border-radius:var(--r8);cursor:pointer;transition:all .2s;font-family:inherit}
.btn-browse:hover{background:rgba(42,114,216,.2)}
#fileInput{display:none}

/* PREVIEW */
.preview{display:none;margin-top:2rem}
.preview.show{display:block}

/* TOP ROW: image + ensemble result */
.top-row{display:grid;grid-template-columns:1fr 1.5fr;gap:20px;margin-bottom:16px}

.p-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r16);overflow:hidden}
.p-box img{width:100%;height:220px;object-fit:cover;display:block}
.p-lbl{padding:8px 13px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}

/* ENSEMBLE RESULT BOX */
.ensemble-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r16);padding:1.5rem}
.ensemble-box h3{font-size:16px;font-weight:700;margin-bottom:4px}
.ens-subtitle{font-size:12px;color:var(--muted);margin-bottom:1.2rem}

/* VOTE ROW */
.vote-row{display:flex;align-items:center;gap:10px;margin-bottom:1.2rem;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--r8);padding:10px 14px}
.vote-class{font-size:18px;font-weight:800;color:var(--text)}
.vote-conf{font-size:13px;color:var(--muted);margin-left:auto}
.vote-icons{display:flex;gap:5px}
.vote-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
.vote-icon.yes{background:rgba(34,197,94,0.2);border:1px solid rgba(34,197,94,0.4)}
.vote-icon.no {background:rgba(255,255,255,0.04);border:1px solid var(--border)}

/* CONFIDENCE BARS */
.c-bars{display:flex;flex-direction:column;gap:10px}
.c-bar{display:flex;flex-direction:column;gap:4px}
.c-info{display:flex;justify-content:space-between;font-size:12px}
.c-name{color:var(--muted)}.c-pct{font-weight:700;color:var(--text)}
.c-track{height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.c-fill{height:100%;border-radius:4px;width:0;transition:width 1.1s cubic-bezier(.4,0,.2,1)}

/* DIAG BOX */
.diag{margin-top:1.2rem;padding:10px 13px;border-radius:var(--r12);display:none;align-items:center;gap:11px}
.diag.danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25)}
.diag.safe  {background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25)}
.diag-ico{font-size:20px;flex-shrink:0}
.diag-txt strong{display:block;font-weight:700;font-size:14px;margin-bottom:2px}
.diag-txt span{font-size:12px;color:var(--muted)}

/* INDIVIDUAL MODELS ROW */
.models-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.model-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r12);padding:14px 13px}
.model-card.agreed{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.05)}
.model-card.disagreed{opacity:0.65}
.mc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mc-name{font-size:12px;font-weight:700;color:var(--text)}
.mc-verdict{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
.mc-verdict.yes{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
.mc-verdict.no {background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.mc-pred{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:2px}
.mc-conf{font-size:10px;color:var(--muted)}
.mc-mini-bars{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.mini-bar-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.mini-track{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.mini-fill{height:100%;border-radius:2px;transition:width 1.1s cubic-bezier(.4,0,.2,1)}

/* CLASSIFY BUTTON */
.btn-run{width:100%;padding:13px;font-size:15px;font-weight:800;font-family:inherit;color:#fff;background:var(--accent);border:none;border-radius:var(--r12);cursor:pointer;transition:all .2s;box-shadow:0 4px 24px var(--glow);display:flex;align-items:center;justify-content:center;gap:10px;margin-top:1.5rem;letter-spacing:.01em}
.btn-run:hover{background:var(--accent2);transform:translateY(-2px);box-shadow:0 8px 32px var(--glow)}
.btn-run:active{transform:scale(.98)}
.btn-run:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-run svg{width:19px;height:19px;display:block;fill:none;stroke:#fff;stroke-width:2;flex-shrink:0}
.spinner{width:17px;height:17px;min-width:17px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.spinner.on{display:block}

/* TOAST */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:#1a2e4a;border:1px solid var(--accent);color:var(--text);font-size:13px;padding:10px 20px;border-radius:var(--r12);z-index:9999;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* PLACEHOLDER */
.placeholder-msg{font-size:13px;color:var(--muted);padding:.8rem 0}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@media(max-width:680px){
  .top-row{grid-template-columns:1fr}
  .models-row{grid-template-columns:1fr}
  .main{padding:2rem 1.25rem 4rem}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9c0-1.66 1.34-3 3-3s3 1.34 3 3c0 2-3 5-3 5s-3-3-3-5z"/><circle cx="12" cy="18" r="1" fill="#fff" stroke="none"/></svg>
    </div>
    <span>NeuroScan <strong>AI</strong></span>
  </a>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="ensemble-badge">
      <span class="dot"></span>
      3-Model Ensemble
    </div>
    <a href="index.html" class="nav-back">← Home</a>
  </div>
</nav>

<main class="main">
  <h1>Classify a Brain MRI Scan</h1>
  <p class="subtitle">Your scan is analysed by <strong>3 models</strong> — ResNet50, VGG16, and DenseNet121. The class with the most votes (majority) is the final prediction.</p>

  <!-- UPLOAD ZONE -->
  <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
    <div class="up-icon">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <h3>Drop your MRI scan here</h3>
    <p>JPEG or PNG · max 10 MB</p>
    <button class="btn-browse" onclick="event.stopPropagation();document.getElementById('fileInput').click()">Browse files</button>
    <input type="file" id="fileInput" accept="image/*"/>
  </div>

  <!-- RESULTS -->
  <div class="preview" id="preview">

    <!-- TOP ROW -->
    <div class="top-row">

      <!-- Uploaded image -->
      <div class="p-box">
        <img id="previewImg" src="" alt="Uploaded MRI"/>
        <div class="p-lbl">Uploaded scan</div>
      </div>
